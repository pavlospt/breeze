name: Release macOS App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    env:
      APP_NAME: Breeze

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # SwiftUI's macros ship only with Xcode; use the newest stable one on the runner.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run tests
        run: swift test

      - name: Build release binary
        run: swift build -c release --product "${APP_NAME}"

      - name: Package app bundle
        id: package
        run: |
          set -euo pipefail

          # Marketing version comes from Support/Info.plist (e.g. 3.0); the run number is the patch.
          BASE_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Support/Info.plist)"
          VERSION="${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          DIST_DIR="${RUNNER_TEMP}/dist"
          APP_BUNDLE="${DIST_DIR}/${APP_NAME}.app"

          BINARY_PATH="$(swift build -c release --product "${APP_NAME}" --show-bin-path)/${APP_NAME}"
          if [[ ! -x "${BINARY_PATH}" ]]; then
            echo "Could not locate release binary at ${BINARY_PATH}."
            exit 1
          fi

          rm -rf "${DIST_DIR}"
          mkdir -p "${APP_BUNDLE}/Contents/MacOS" "${APP_BUNDLE}/Contents/Resources"
          cp "${BINARY_PATH}" "${APP_BUNDLE}/Contents/MacOS/${APP_NAME}"
          cp Support/Info.plist "${APP_BUNDLE}/Contents/Info.plist"
          cp Support/AppIcon.icns "${APP_BUNDLE}/Contents/Resources/AppIcon.icns"

          PLIST="${APP_BUNDLE}/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION}" "${PLIST}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" "${PLIST}"

          {
            printf "version=%s\n" "${VERSION}"
            printf "app_bundle=%s\n" "${APP_BUNDLE}"
            printf "zip_path=%s\n" "${DIST_DIR}/${APP_NAME}-macOS.zip"
            printf "sha_path=%s\n" "${DIST_DIR}/${APP_NAME}-macOS.zip.sha256"
          } >> "${GITHUB_OUTPUT}"

      - name: Detect signing configuration
        id: signing
        env:
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          CODESIGN_CERT_P12: ${{ secrets.MACOS_CODESIGN_CERT_P12 }}
          CODESIGN_CERT_PASSWORD: ${{ secrets.MACOS_CODESIGN_CERT_P12_PASSWORD }}
          NOTARIZE_APPLE_ID: ${{ secrets.MACOS_NOTARIZE_APPLE_ID }}
          NOTARIZE_TEAM_ID: ${{ secrets.MACOS_NOTARIZE_TEAM_ID }}
          NOTARIZE_APP_PASSWORD: ${{ secrets.MACOS_NOTARIZE_APP_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -n "${CODESIGN_IDENTITY}" && -n "${CODESIGN_CERT_P12}" && -n "${CODESIGN_CERT_PASSWORD}" ]]; then
            echo "sign_enabled=true" >> "${GITHUB_OUTPUT}"
            echo "Developer ID code signing is enabled."
          else
            echo "sign_enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::Missing code-signing secrets. Release will be ad-hoc signed and blocked by Gatekeeper on first launch."
          fi

          if [[ -n "${NOTARIZE_APPLE_ID}" && -n "${NOTARIZE_TEAM_ID}" && -n "${NOTARIZE_APP_PASSWORD}" ]]; then
            echo "notarize_enabled=true" >> "${GITHUB_OUTPUT}"
            echo "Notarization is enabled."
          else
            echo "notarize_enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::Missing notarization secrets. Release will not be notarized."
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.sign_enabled == 'true'
        env:
          CODESIGN_CERT_P12: ${{ secrets.MACOS_CODESIGN_CERT_P12 }}
          CODESIGN_CERT_PASSWORD: ${{ secrets.MACOS_CODESIGN_CERT_P12_PASSWORD }}
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="${RUNNER_TEMP}/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="${RUNNER_TEMP}/developer_id.p12"

          CERT_B64="$(printf "%s" "${CODESIGN_CERT_P12}" | tr -d '\r\n')"
          if [[ -z "${CERT_B64}" ]]; then
            echo "Certificate secret is empty after trimming line endings."
            exit 1
          fi

          (printf "%s" "${CERT_B64}" | base64 --decode > "${CERT_PATH}") || (printf "%s" "${CERT_B64}" | base64 -D > "${CERT_PATH}")
          if [[ ! -s "${CERT_PATH}" ]]; then
            echo "Decoded certificate is empty (base64 length: ${#CERT_B64})."
            exit 1
          fi

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERT_PATH}" -f pkcs12 -k "${KEYCHAIN_PATH}" -P "${CODESIGN_CERT_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "${KEYCHAIN_PATH}" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          rm -f "${CERT_PATH}"

      - name: Code sign app bundle
        env:
          SIGN_ENABLED: ${{ steps.signing.outputs.sign_enabled }}
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APP_BUNDLE: ${{ steps.package.outputs.app_bundle }}
        run: |
          set -euo pipefail

          if [[ "${SIGN_ENABLED}" == "true" ]]; then
            # Hardened runtime + secure timestamp are required for notarization.
            codesign --force --options runtime --timestamp --sign "${CODESIGN_IDENTITY}" "${APP_BUNDLE}"
          else
            # Same ad-hoc signature scripts/build-app.sh uses for local builds.
            codesign --force --sign - "${APP_BUNDLE}"
          fi
          codesign --verify --deep --strict --verbose=2 "${APP_BUNDLE}"

      - name: Notarize app bundle
        if: steps.signing.outputs.sign_enabled == 'true' && steps.signing.outputs.notarize_enabled == 'true'
        env:
          NOTARIZE_APPLE_ID: ${{ secrets.MACOS_NOTARIZE_APPLE_ID }}
          NOTARIZE_TEAM_ID: ${{ secrets.MACOS_NOTARIZE_TEAM_ID }}
          NOTARIZE_APP_PASSWORD: ${{ secrets.MACOS_NOTARIZE_APP_PASSWORD }}
          APP_BUNDLE: ${{ steps.package.outputs.app_bundle }}
        run: |
          set -euo pipefail

          NOTARY_ZIP="${RUNNER_TEMP}/${APP_NAME}-notary.zip"

          ditto -c -k --sequesterRsrc --keepParent "${APP_BUNDLE}" "${NOTARY_ZIP}"
          xcrun notarytool submit "${NOTARY_ZIP}" \
            --apple-id "${NOTARIZE_APPLE_ID}" \
            --password "${NOTARIZE_APP_PASSWORD}" \
            --team-id "${NOTARIZE_TEAM_ID}" \
            --wait
          xcrun stapler staple "${APP_BUNDLE}"
          spctl --assess --type execute --verbose=2 "${APP_BUNDLE}"

      - name: Create release archive
        env:
          APP_BUNDLE: ${{ steps.package.outputs.app_bundle }}
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
          SHA_PATH: ${{ steps.package.outputs.sha_path }}
        run: |
          set -euo pipefail

          ditto -c -k --sequesterRsrc --keepParent "${APP_BUNDLE}" "${ZIP_PATH}"
          (cd "$(dirname "${ZIP_PATH}")" && shasum -a 256 "$(basename "${ZIP_PATH}")") > "${SHA_PATH}"
          cat "${SHA_PATH}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package.outputs.version }}
          name: Breeze ${{ steps.package.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.sha_path }}
